<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PTP Count</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f6f8;color:#1f2937}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:34px;font-weight:800}.btn{border:0;border-radius:12px;min-height:46px;padding:11px 14px;font-weight:700;background:#111827;color:white}.btn2{background:#eef0f3;color:#111827}.row{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:13px;color:#6b7280;line-height:1.5}.canvasbox{margin-top:12px;border:1px solid #d1d5db;border-radius:14px;overflow:auto;background:#e5e7eb;max-height:70vh;-webkit-overflow-scrolling:touch}.canvasinner{min-width:100%;width:max-content;padding:6px}canvas{display:block;touch-action:manipulation;background:white}.hidden{display:none}.danger{color:#b42318}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea{padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit;width:100%}.timer{font-variant-numeric:tabular-nums;font-weight:700}.zoomrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.zoombadge{min-width:58px;text-align:center;font-weight:700;background:#f3f4f6;border-radius:999px;padding:8px 10px}.zoomslider{flex:1;min-width:140px}
</style>
</head>
<body>
<div class="wrap">
<section class="card"><div class="top"><div><h1 style="margin:0;font-size:22px">PTP Count</h1><div class="hint">iPhone試作版 v1.3（ピンチ拡大対応）</div></div><div><span class="count" id="count">0</span> 錠</div></div></section>
<section class="card"><h2 style="font-size:17px">1. 写真を用意</h2><div class="row"><label class="btn">カメラで撮影<input id="camera" type="file" accept="image/*" capture="environment" hidden></label><label class="btn btn2">写真を選択<input id="photo" type="file" accept="image/*" hidden></label></div><p class="hint">空包を除き、PTPをなるべく重ねず、真上から撮影してください。</p></section>
<section id="counter" class="card hidden"><div class="top"><h2 style="font-size:17px">2. 1錠ずつタップ</h2><div>計数時間 <span id="timer" class="timer">00:00</span></div></div><div class="row"><button id="add" class="btn">＋追加</button><button id="del" class="btn btn2">−削除</button><button id="undo" class="btn btn2">戻す</button><button id="reset" class="btn btn2 danger">全消去</button></div><div class="zoomrow"><button id="zoomOut" class="btn btn2" type="button">− 縮小</button><button id="zoomReset" class="btn btn2" type="button">全体表示</button><button id="zoomIn" class="btn btn2" type="button">＋ 拡大</button><input id="zoomRange" class="zoomslider" type="range" min="20" max="400" step="10" value="100"><span id="zoomLabel" class="zoombadge">100%</span></div><div class="canvasbox" id="canvasBox"><div class="canvasinner"><canvas id="cv"></canvas></div></div><p id="help" class="hint">残薬1錠分のPTPポケットを1回ずつタップしてください。ボタンやスライダーに加えて、2本指のピンチ操作でも拡大縮小できます。拡大後は画像を指で上下左右に動かせます。</p><button id="finish" class="btn" style="width:100%">計数を確定</button></section>
<section id="result" class="card hidden"><h2 style="font-size:17px">3. 結果</h2><p><strong id="finalCount">0</strong> 錠 ／ <strong id="finalTime">00:00</strong></p><label class="field">検体ID（任意）<input id="sample" placeholder="例 TEST-001"></label><label class="field">真の錠数（任意）<input id="truth" type="number" min="0" inputmode="numeric"></label><label class="field">メモ（任意）<textarea id="notes" rows="3"></textarea></label><div class="row"><button id="save" class="btn">端末に保存</button><button id="new" class="btn btn2">新しい写真</button></div></section>
<section class="card"><div class="top"><h2 style="font-size:17px">保存データ</h2><span id="nrec">0件</span></div><div id="list" class="hint">まだありません。</div><div class="row" style="margin-top:12px"><button id="csv" class="btn btn2">CSVを書き出す</button><button id="clear" class="btn btn2 danger">全データ削除</button></div></section>
<p class="hint">研究・試作用です。最終的な残薬数は人が確認してください。</p>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),base=document.createElement('canvas'),bctx=base.getContext('2d');
let pts=[],hist=[],mode='add',start=0,tick=null,elapsed=0,fileName='',zoom=1;
const KEY='ptp-count-v1';
const pinch={active:false,startDist:0,startZoom:1,suppressUntil:0};
function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timerStart(){clearInterval(tick);start=performance.now();elapsed=0;$('timer').textContent='00:00';tick=setInterval(()=>{elapsed=(performance.now()-start)/1000;$('timer').textContent=fmt(elapsed)},250)}
function timerStop(){if(start)elapsed=(performance.now()-start)/1000;clearInterval(tick);tick=null;start=0}
function applyZoom(){if(!base.width)return;cv.style.width=Math.round(base.width*zoom)+'px';cv.style.height=Math.round(base.height*zoom)+'px';$('zoomRange').value=Math.round(zoom*100);$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function fitZoom(){const box=$('canvasBox');const w=Math.max(1,box.clientWidth-12);const h=Math.max(1,window.innerHeight*.68-12);return Math.max(.2,Math.min(1,w/base.width,h/base.height))}
function setZoom(v,keepCenter=false){const box=$('canvasBox');let rx=.5,ry=.5;if(keepCenter&&box.scrollWidth>box.clientWidth)rx=(box.scrollLeft+box.clientWidth/2)/box.scrollWidth;if(keepCenter&&box.scrollHeight>box.clientHeight)ry=(box.scrollTop+box.clientHeight/2)/box.scrollHeight;zoom=Math.max(.2,Math.min(4,v));applyZoom();if(keepCenter)requestAnimationFrame(()=>{box.scrollLeft=Math.max(0,rx*box.scrollWidth-box.clientWidth/2);box.scrollTop=Math.max(0,ry*box.scrollHeight-box.clientHeight/2)})}
function draw(){if(!base.width)return;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(base,0,0);const r=Math.max(18,Math.min(34,cv.width*.018));pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.82)';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#ff2d55';ctx.stroke();ctx.fillStyle='#111827';ctx.font='700 '+Math.round(r*.85)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,p.x,p.y)});$('count').textContent=pts.length;applyZoom()}
function load(f){if(!f)return;fileName=f.name||'camera.jpg';const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));base.width=cv.width=Math.round(im.naturalWidth*s);base.height=cv.height=Math.round(im.naturalHeight*s);bctx.drawImage(im,0,0,base.width,base.height);pts=[];hist=[];$('counter').classList.remove('hidden');$('result').classList.add('hidden');draw();requestAnimationFrame(()=>setZoom(fitZoom()));timerStart();URL.revokeObjectURL(u);$('counter').scrollIntoView({behavior:'smooth'})};im.src=u}
$('camera').onchange=e=>load(e.target.files[0]);$('photo').onchange=e=>load(e.target.files[0]);
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
cv.onclick=e=>{if(Date.now()<pinch.suppressUntil)return;const p=point(e);hist.push(pts.map(x=>({...x})));if(mode==='add')pts.push(p);else if(pts.length){let k=0,d=Infinity;pts.forEach((q,i)=>{const z=Math.hypot(q.x-p.x,q.y-p.y);if(z<d){d=z;k=i}});if(d<80*cv.width/cv.getBoundingClientRect().width)pts.splice(k,1)}draw()};
$('add').onclick=()=>{mode='add';$('help').textContent='残薬1錠分のPTPポケットを1回ずつタップしてください。ボタンやスライダーに加えて、2本指のピンチ操作でも拡大縮小できます。拡大後は画像を指で上下左右に動かせます。'};
$('del').onclick=()=>{mode='del';$('help').textContent='削除したい番号をタップしてください。必要なら先に拡大して、画像を指で動かしてください。'};
$('undo').onclick=()=>{if(hist.length){pts=hist.pop();draw()}};
$('reset').onclick=()=>{if(confirm('すべて消去しますか？')){hist.push(pts.map(x=>({...x})));pts=[];draw()}};
$('zoomIn').onclick=()=>setZoom(zoom+.25,true);$('zoomOut').onclick=()=>setZoom(zoom-.25,true);$('zoomReset').onclick=()=>{setZoom(fitZoom());$('canvasBox').scrollTo({left:0,top:0})};$('zoomRange').oninput=e=>setZoom(Number(e.target.value)/100,true);
$('finish').onclick=()=>{timerStop();$('finalCount').textContent=pts.length;$('finalTime').textContent=fmt(elapsed);$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'})};
function touchDist(touches){return Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY)}
const box=$('canvasBox');
box.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch.active=true;pinch.startDist=touchDist(e.touches);pinch.startZoom=zoom;pinch.suppressUntil=Date.now()+400;e.preventDefault()}},{passive:false});
box.addEventListener('touchmove',e=>{if(pinch.active&&e.touches.length===2){const d=touchDist(e.touches);if(pinch.startDist>0){setZoom(pinch.startZoom*(d/pinch.startDist),true);pinch.suppressUntil=Date.now()+400}e.preventDefault()}},{passive:false});
box.addEventListener('touchend',e=>{if(e.touches.length<2&&pinch.active){pinch.active=false;pinch.suppressUntil=Date.now()+400}});
box.addEventListener('touchcancel',()=>{pinch.active=false;pinch.suppressUntil=Date.now()+400});
window.addEventListener('resize',()=>{if(base.width&&zoom<=1.01)setZoom(fitZoom())});
function records(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function put(a){localStorage.setItem(KEY,JSON.stringify(a));render()}
$('save').onclick=()=>{const t=$('truth').value===''?null:Number($('truth').value),a=records();a.push({id:Date.now(),date:new Date().toISOString(),sample:$('sample').value,count:pts.length,trueCount:t,sec:Math.round(elapsed),file:fileName,notes:$('notes').value});put(a);alert('保存しました')};
$('new').onclick=()=>location.reload();function render(){const a=records();$('nrec').textContent=a.length+'件';$('list').innerHTML=a.length?a.slice().reverse().map(r=>'<div style="padding:8px 0;border-bottom:1px solid #eee"><b>'+((r.sample||'IDなし'))+'</b>：'+r.count+'錠 / '+fmt(r.sec)+(r.trueCount===null?'':' / 真値 '+r.trueCount+'錠')+'</div>').join(''):'まだありません。'}
$('clear').onclick=()=>{if(confirm('保存データを全削除しますか？'))put([])};$('csv').onclick=()=>{const a=records();if(!a.length)return alert('データがありません');const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['date','sample_id','file_name','count','true_count','error','elapsed_sec','notes'],...a.map(r=>[r.date,r.sample,r.file,r.count,r.trueCount??'',r.trueCount===null?'':r.count-r.trueCount,r.sec,r.notes])],csv='\ufeff'+rows.map(x=>x.map(esc).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),ln=document.createElement('a');ln.href=u;ln.download='PTP_Count.csv';ln.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script>
</body>
</html>
